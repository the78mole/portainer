version: '3.8'
services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    environment:
      - PUBLIC_VAR=${PUBLIC_VAR:-default_value}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - API_TOKEN=${API_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    volumes:
      - ./html:/usr/share/nginx/html:ro

  redis:
    image: redis:alpine
    environment:
      - REDIS_PASSWORD=${DATABASE_PASSWORD}